<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report a problem · Pramaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<main class="wrap" style="padding-top:32px;padding-bottom:48px">
  <h1 data-i18n="cmp.title"></h1>
  <p class="muted" data-i18n="cmp.lead"></p>

  <div id="tabs" class="card" style="margin-top:20px">
    <div class="tabs" role="tablist">
      <button data-tab="new" aria-selected="true" data-i18n="cmp.tab.new"></button>
      <button data-tab="track" aria-selected="false" data-i18n="cmp.tab.track"></button>
    </div>

    <div data-panel="new">
      <div class="two" style="align-items:start;gap:24px">
        <form id="cmpForm">
          <label><span data-i18n="cmp.f.inst"></span><select id="instSel" required></select></label>
          <label id="instNameWrap" hidden><span data-i18n="cmp.f.instname"></span><input id="instName" maxlength="160"></label>
          <label><span data-i18n="cmp.f.city"></span><input id="city" maxlength="80"></label>
          <label><span data-i18n="cmp.f.cat"></span><select id="catSel" required></select></label>
          <label><span data-i18n="cmp.f.desc"></span><textarea id="desc" required minlength="10" maxlength="2000" data-i18n-ph="cmp.f.desc.ph"></textarea></label>
          <div><button class="btn" type="submit" data-i18n="cmp.submit"></button></div>
          <div id="cmpResult" class="result" hidden></div>
        </form>

        <aside class="card" style="box-shadow:none;background:var(--surface-2)">
          <h3 data-i18n="cmp.helper.title"></h3>
          <p class="muted small" data-i18n="cmp.helper.note"></p>
          <div class="chat" id="chat"></div>
          <form id="chatForm" class="row" style="margin-top:10px">
            <input id="chatIn" style="flex:1 1 160px" data-i18n-ph="cmp.helper.ph" maxlength="300">
            <button class="btn small" type="submit" data-i18n="cmp.helper.send"></button>
          </form>
        </aside>
      </div>
    </div>

    <div data-panel="track" hidden>
      <form id="trackForm" class="row" style="align-items:end">
        <label style="flex:1 1 240px"><span data-i18n="cmp.f.ticket"></span><input id="ticket" required placeholder="CMP-5001-XXXX" autocomplete="off"></label>
        <button class="btn" type="submit" data-i18n="cmp.track.btn"></button>
      </form>
      <div id="trackOut" style="margin-top:20px"></div>
    </div>
  </div>
</main>
<script src="js/complaint.js"></script>
</body>
</html>
